id = "ecko"
name = "Ecko"
version = "0.74.1"
schema_version = 1
authors = ["Sean Nieuwoudt <sean@isean.co.za>"]
description = "Ecko language support: syntax highlighting, outline, brackets and indentation."
repository = "https://github.com/ecko-lang/zed-ecko"

# Zed clones the grammar and builds it to WebAssembly. Until
# ecko-lang/tree-sitter-ecko is published, point this at a local clone for a
# dev install: repository = "file:///path/to/tree-sitter-ecko", rev = its HEAD.
[grammars.ecko]
repository = "https://github.com/ecko-lang/tree-sitter-ecko"
rev = "0000000000000000000000000000000000000000"

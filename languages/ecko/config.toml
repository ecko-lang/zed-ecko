name = "Ecko"
grammar = "ecko"
path_suffixes = ["ecko"]
line_comments = ["# "]
documentation_comment = { start = "## ", prefix = "## ", end = "", tab_size = 0 }
first_line_pattern = '^#!.*\becko\b'
tab_size = 4
autoclose_before = ";:.,=}])>"
word_characters = ["_"]
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
